<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Все версии — APEX CLIENT</title>
<meta name="description" content="История изменений APEX CLIENT: все версии с описанием и поиском.">
<meta property="og:title" content="Все версии — APEX CLIENT">
<meta property="og:image" content="https://dubstep2004.github.io/og.png">
<meta name="theme-color" content="#0a0d1c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/apex-client/invite/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0a0d1c; --ink2: #11152a; --line: #222842; --text: #eef1fa; --dim: #8c93b0; --faint: #5b6283; --cyan: #22d3ee; --violet: #6d5cff;
    --display: "Unbounded", "Manrope", system-ui, sans-serif; }
  @media (prefers-color-scheme: light) { :root { --ink: #f5f6fb; --ink2: #ffffff; --line: #e1e4ee; --text: #12152a; --dim: #525a78; --faint: #767d99; --cyan: #0b8fb0; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 17px/1.6 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--cyan); } :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  header { border-bottom: 1px solid var(--line); } header .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-family: var(--display); font-weight: 700; font-size: 18px; }
  .logo img { width: 34px; height: 34px; border-radius: 10px; }
  header nav { margin-left: auto; font-weight: 700; font-size: 15px; } header nav a { color: var(--dim); text-decoration: none; }
  h1 { font-family: var(--display); font-size: clamp(30px, 5vw, 44px); letter-spacing: -.03em; line-height: 1.1; margin: 48px 0 12px; }
  .lead { color: var(--dim); font-size: 18px; margin: 0 0 30px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 34px; }
  .toc a { text-decoration: none; color: var(--text); border: 1px solid var(--line); background: var(--ink2); border-radius: 99px; padding: 7px 14px; font-size: 14px; font-weight: 700; }
  section { border-top: 1px solid var(--line); padding: 26px 0 8px; scroll-margin-top: 16px; }
  h2 { font-size: 21px; margin: 0 0 10px; }
  p, li { color: var(--dim); } b { color: var(--text); }
  ol, ul { padding-left: 22px; } li { margin: 6px 0; }
  .note { background: var(--ink2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: 15px; color: var(--dim); }
  .help-cta { margin: 40px 0 60px; padding: 26px; border-radius: 24px; background: var(--ink2); border: 1px solid var(--line); text-align: center; }
  .btn { display: inline-block; margin-top: 12px; text-decoration: none; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--violet), #22d3ee); border-radius: 14px; padding: 13px 20px; }
  footer { color: var(--faint); font-size: 14px; padding: 0 0 50px; } footer a { color: var(--faint); }

  .search { width: 100%; font: inherit; color: var(--text); background: var(--ink2); border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; margin: 0 0 24px; }
  .rel { border-top: 1px solid var(--line); padding: 22px 0 6px; }
  .rel h2 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .rel h2 small { color: var(--faint); font-size: 14px; font-weight: 600; }
  .rel .tag { font-size: 12px; font-weight: 800; color: #f5b759; border: 1px solid #f5b75966; border-radius: 99px; padding: 1px 8px; }
  .rel h3 { font-size: 15px; margin: 12px 0 4px; color: var(--text); }
  .rel a.dl { font-weight: 800; font-size: 14px; text-decoration: none; }
  mark { background: #f5b75955; color: inherit; border-radius: 4px; }
  .fp { font: 14px/1.7 ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; background: var(--ink2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; color: var(--text); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
  .tabs button { font: inherit; font-weight: 700; font-size: 14px; color: var(--dim); background: var(--ink2); border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--text); border-color: #6d5cff; background: #6d5cff22; }
  .shot { display: flex; gap: 12px; align-items: center; margin: 10px 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--ink2); font-size: 15px; color: var(--dim); }
  .shot .ic { flex: 0 0 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #6d5cff22; }
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/"><img src="/apex-client/invite/icon.png" alt="">APEX CLIENT</a><nav><a href="/">На главную</a></nav></div></header>
<main class="wrap">

  <h1>Все версии</h1>
  <p class="lead">Что менялось в APEX CLIENT. Ищите по словам: «DNS», «белые списки», «часы».</p>
  <input class="search" id="q" type="search" placeholder="Поиск по изменениям" aria-label="Поиск по изменениям">
  <div id="list"><p class="note">Загружаем версии с GitHub…</p></div>
  <p><a href="https://github.com/Dubstep2004/apex-client/releases">Все релизы на GitHub</a></p>
</main>
<footer><div class="wrap">© 2026 Dubstep2004 · <a href="/">APEX CLIENT</a></div></footer>
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let rels = []
function md(body, q) {
  const hl = t => { let h = esc(t); if (q) h = h.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); return h }
  const lines = (body || '').split(/\n---/)[0].split('\n').map(l => l.trim()).filter(Boolean)
  let out = '', inList = false
  for (const l of lines) {
    if (/^[-*] /.test(l)) { if (!inList) { out += '<ul>'; inList = true } out += '<li>' + hl(l.slice(2).replace(/\*\*/g, '')) + '</li>' }
    else { if (inList) { out += '</ul>'; inList = false } out += '<h3>' + hl(l.replace(/\*\*/g, '').replace(/^#+\s*/, '')) + '</h3>' }
  }
  return out + (inList ? '</ul>' : '')
}
function render() {
  const q = document.getElementById('q').value.trim()
  const shown = rels.filter(r => !q || (r.tag_name + ' ' + (r.body || '')).toLowerCase().includes(q.toLowerCase()))
  document.getElementById('list').innerHTML = shown.length ? shown.map(r => {
    const apk = r.assets.find(a => /^apex-(client|vpn)-.*\.apk$/.test(a.name))
    return `<div class="rel"><h2>${esc(r.tag_name.replace(/^v/, ''))} <small>${new Date(r.published_at).toLocaleDateString('ru', { day: 'numeric', month: 'long', year: 'numeric' })}</small>${r.prerelease ? '<span class="tag">бета</span>' : ''}</h2>
      ${md(r.body, q)}${apk ? `<p><a class="dl" href="${apk.browser_download_url}">Скачать ${esc(apk.name)}</a></p>` : ''}</div>`
  }).join('') : '<p class="note">Ничего не нашлось. Попробуйте другое слово.</p>'
}
fetch('https://api.github.com/repos/Dubstep2004/apex-client/releases?per_page=100').then(r => r.ok ? r.json() : Promise.reject())
  .then(l => { rels = l.filter(r => !r.draft); render() })
  .catch(() => { document.getElementById('list').innerHTML = '<p class="note">Не удалось загрузить с GitHub. <a href="https://github.com/Dubstep2004/apex-client/releases">Открыть релизы на GitHub</a></p>' })
document.getElementById('q').oninput = render
</script>
</body>
</html>
