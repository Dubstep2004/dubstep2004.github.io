name: Проверка визитки

# После каждого изменения сайта и раз в день: все страницы в настоящем браузере на телефоне и компьютере —
# ошибки JavaScript, битые ссылки и якоря, вылезание за край экрана, кнопка «Скачать».
on:
  push:
    branches: [main]
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Браузер для проверки
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Проверить визитку
        run: node tests/check-site.js
